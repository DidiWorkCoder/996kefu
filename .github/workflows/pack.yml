name: 打包 Windows 安装包

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: 构建 NSIS 安装包
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run pack

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist\*.exe | Select-Object Name, @{ n = '大小(MB)'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: 996kefu-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "996客服管理器 $tag" --generate-notes
          }
          gh release upload $tag dist/*.exe --clobber
